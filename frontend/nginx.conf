server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The Angular production build calls the API on the same origin (/api), so no CORS is needed.
  location /api/ {
    client_max_body_size 6m; # image uploads are limited to 5 MB by the API
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded hotel images are stored and served by the API.
  # "^~" stops the static-file regex below from catching .png/.jpg requests.
  location ^~ /uploads/ {
    proxy_pass http://api:8080;
  }

  # Hashed bundles can be cached for a long time.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback so deep links like /admin/hotels work on reload.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
